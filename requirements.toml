[task]
must_read = [
  "AGENTS.md",
  "docs/engineering/workflow.md",
  "docs/template-library/GOVERNANCE-KERNEL.md",
  "docs/template-library/SPECIALIST-CONTROLS.md",
  "docs/engineering/contracts/architecture.md",
  "docs/engineering/contracts/testing.md",
  "docs/engineering/contracts/accessibility.md",
  "docs/engineering/contracts/security.md",
  "docs/engineering/contracts/release.md"
]

must_run = [
  "python3 -S scripts/check_prompts.py",
  "python3 -S scripts/check_workflow.py",
  "python3 -S scripts/check_examples.py",
  "python3 -S scripts/check_claims.py",
  "python3 -S scripts/check_template_library.py",
  "python3 -S scripts/compose_assets.py --check",
  "python3 -S scripts/check_research_basis.py",
  "python3 -S scripts/check_licenses.py",
  "python3 -S scripts/build_starter.py --check",
  "python3 -S scripts/run_evals.py --dry-run --check",
  "npm run lint",
  "npm run test",
  "npm run test:e2e",
  "npm run test:a11y",
  "npm run test:links",
  "npm run test:zip",
  "bash scripts/verify-release.sh"
]

must_not = [
  "introduce a backend, authentication, paid API, or cloud service",
  "use secrets, personal data, or production data",
  "replace native controls with custom widgets without necessity",
  "claim compliance, security, accessibility, or effectiveness without evidence"
]

[review]
require_diff_summary = true
require_risk_summary = true
require_accessibility_review = true
require_security_review_when_relevant = true
require_docs_truthfulness_review = true
require_release_verification = true

[a11y]
must_map_wcag_when_relevant = true
must_separate_deterministic_and_manual = true
never_claim_full_compliance = true

[release]
docs_must_match_behavior = true
screenshots_must_match_current_ui = true
known_limitations_must_be_disclosed = true

[starter]
verification_scope = "workflow assets and browser-local starter scaffold only"
built_artifact = "dist/starter-manifest.json"
teaching_exercise = "examples/exercises/exercise-001-comparison-view"
