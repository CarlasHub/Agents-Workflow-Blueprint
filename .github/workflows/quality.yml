name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: Run source checks
        run: |
          python3 -S scripts/check_prompts.py
          python3 -S scripts/check_workflow.py
          python3 -S scripts/check_examples.py
          python3 -S scripts/check_claims.py
          python3 -S scripts/check_template_library.py
          python3 -S scripts/compose_assets.py --check
          python3 -S scripts/check_research_basis.py
          python3 -S scripts/check_licenses.py
          python3 -S scripts/check_links.py
          python3 -S scripts/build_starter.py --check
          python3 -S scripts/run_evals.py --dry-run --check
      - name: Run lint and unit gates
        run: |
          npm run lint
          npm run test
          npm run test:zip
          npm run test:links

  browser-and-accessibility:
    needs: source-and-unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Run automated accessibility tests
        run: npm run test:a11y
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artefacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
